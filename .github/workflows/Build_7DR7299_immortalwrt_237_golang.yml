name: Build_7DR7299_immortalwrt_237_golang

# Add a button to trigger the workflow
on: 
  repository_dispatch:
  workflow_dispatch:

  #schedule:
    # UTC 时间对应北京时间（UTC+8=北京时间）：7月20日，早上4点10分 开始编译
    #- cron: '10 20 19 7 *'  
    # UTC 时间对应北京时间：每月2、9、16、23日，早上4点10分 开始编译    
    #- cron: '10 20 1,8,15,22 * *'

permissions:
  contents: write
 
jobs:
  build:
    # 建议 immortalwrt 使用低版本，更容易编译成功
    runs-on: ubuntu-22.04

    steps:
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 2048
        temp-reserve-mb: 512
        swap-size-mb: 2048
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        overprovision-lvm: 'true'
        build-mount-path: '/builder'        

    - name: Prepare Builder Directory
      run: |
        sudo mkdir -p /builder
        sudo chown -R runner:runner /builder
        df -hT

    - name: Checkout repository
      uses: actions/checkout@v7        

    # 如果“Initialization environment”报错，是因为官方 APT 设置依赖项的脚本已经不合时宜，在官方修正之前，请使用下方的代码
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo rm -rf /etc/apt/sources.list.d/* /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/graalvm /usr/local/.ghcup \
        /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules
        sudo timedatectl set-timezone "Asia/Shanghai"
        sudo chown $USER:$GROUPS $GITHUB_WORKSPACE

    # 使用此代码前，请先更新依赖包的命令：https://github.com/sky2016cn/AutoBuild-lede（依赖包仓库） 
    #- name: Initialization environment
    #  env:
    #    DEBIAN_FRONTEND: noninteractive
    #  run: |  
    #    sudo -E apt-get -qq update
    #    sudo -E apt-get -qq install $(curl -fsSL raw.githubusercontent.com/sky2016cn/OpenWrt-Depends/main/depends-immortalwrt)
    #    sudo -E apt-get -qq autoremove --purge
    #    sudo -E apt-get -qq clean
    #    sudo rm -rf /etc/apt/sources.list.d/* /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/graalvm /usr/local/.ghcup \
    #    /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules
    #    sudo timedatectl set-timezone "Asia/Shanghai"
    #    sudo chown $USER:$GROUPS $GITHUB_WORKSPACE
        
    - name: Check Space
      run: |
        df -h

    - name: Clone source code
      env:
        REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
      run: |
        # 拉取 237大佬 mt798x-mt799x-6.6-mtwifi 分支
        git clone -b mt798x-mt799x-6.6-mtwifi --single-branch --filter=blob:none "$REPO_URL" /builder/openwrt || { echo 'Git clone failed!'; exit 1; }
        
        # ======== 编译下方插件，请先去掉注释 ======== 
        #cd /builder/openwrt

        # ======== 编译 OpenClash 最新版（不推荐）=========
        # immortalwrt 插件库已经包含 OpenClash，若源码被删除或编译 OpenClash 最新版，使用以下命令自行编译，打开 immortalwrt官方插件库查询：https://github.com/immortalwrt/immortalwrt（选择 openwrt-24.10分支，打开 feeds.conf.default文件，再打开luci仓库找到“applications”查询插件）
        #sed -i '1i src-git openclash https://github.com/vernesong/OpenClash.git;master' ./feeds.conf.default
        
        # ======== 编译 passwall 最新版（不推荐）=========
        # immortalwrt插件库已经包含 passwall，若源码被删除或编译 Passwall 最新版，使用以下命令自行编译，打开 immortalwrt官方插件库查询：https://github.com/immortalwrt/immortalwrt（选择 openwrt-24.10分支，打开 feeds.conf.default文件，再打开luci仓库找到“applications”查询插件）
        # 编译 passwall_luci，去掉下面注释，此命令会在 feeds.conf.default文件，第 1 行插入 passwall_luci
        #sed -i '1i src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main' ./feeds.conf.default

        # 编译 passwall_packages，再次在 feeds.conf.default文件，第 1 行插入 passwall_packages (这样 packages 就变成了第 1 行，luci 变成了第 2 行)
        #sed -i '1i src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main' ./feeds.conf.default
        
        # ======== 编译 passwall2 最新版（不推荐）=========
        # 编译 passwall2_luci，不要和 passwall_luci 一起编译，编译出来的固件会不稳定，第 1 行插入 passwall2_luci
        #sed -i '1i src-git passwall2_luci https://github.com/Openwrt-Passwall/openwrt-passwall2.git;main' ./feeds.conf.default
        
    - name: Update feeds
      working-directory: /builder/openwrt
      run: |
        ./scripts/feeds update -a   

    - name: Install feeds
      working-directory: /builder/openwrt
      run: |
        ./scripts/feeds install -a

    - name: Install feeds
      working-directory: /builder/openwrt
      run: |
        ./scripts/feeds install -a
        
       # ======== 1. 编译 OpenClash 最新版（使用 package 编译法，更新和安装 feeds 命令之后）推荐 =========
       # OpenClash 推荐使用上方写入 ./feeds.conf.default 编译法
       # immortalwrt 插件库已经包含 OpenClash，若源码被删除或编译 OpenClash 最新版，使用以下命令自行编译，打开 immortalwrt官方插件库查询：https://github.com/immortalwrt/immortalwrt（选择 openwrt-24.10分支，打开 feeds.conf.default文件，再打开luci仓库找到“applications”查询插件）
    #- name: Import Official Recommended OpenClash
    #  working-directory: /builder/openwrt
    #  run: |
        # 移除 openwrt feeds 自带的核心库，
    #    rm -rf package/luci-app-openclash
    #    rm -rf feeds/luci/applications/luci-app-openclash

        # 克隆 OpenClash 最新版
    #    git clone --depth=1 https://github.com/vernesong/OpenClash.git /tmp/OpenClash

        # 只移动 luci-app-openclash 软件包到 package 目录下
    #    mv /tmp/OpenClash/luci-app-openclash package/

        # 删除临时目录
    #    rm -rf tmp

       # ======== 2. 编译 Passwall 最新版（使用 package 编译法，更新和安装 feeds 命令之后）推荐 =========
       # 不推荐使用写入 ./feeds.conf.default 编译法
       # immortalwrt 插件库已经包含 Passwall ，若源码被删除或编译最新版，使用以下命令自行编译，打开 immortalwrt官方插件库查询：https://github.com/immortalwrt/immortalwrt（选择 openwrt-24.10分支，打开 feeds.conf.default文件，再打开luci仓库找到“applications”查询插件）
    - name: Import Official Recommended Passwall
      working-directory: /builder/openwrt
      run: |
        # 移除 openwrt feeds 自带的核心库
        rm -rf feeds/packages/net/{xray-core,v2ray-geodata,sing-box,chinadns-ng,dns2socks,hysteria,ipt2socks,microsocks,naiveproxy,shadowsocks-rust,shadowsocksr-libev,simple-obfs,tcping,v2ray-plugin,xray-plugin,geoview,shadow-tls}
        git clone https://github.com/Openwrt-Passwall/openwrt-passwall-packages package/passwall-packages

        # 移除 openwrt feeds 过时的luci版本
        rm -rf feeds/luci/applications/luci-app-passwall
        git clone https://github.com/Openwrt-Passwall/openwrt-passwall package/passwall-luci

        # 删除临时目录
        rm -rf tmp

    # ============================================================================================================
    # 🌟 1. 解决 Passwall 和 daed 报错问题：升级 Go 1.27 工具链并绑定依赖（必须放在 feeds更新 和 passwall 拉取命令之后）
    # ============================================================================================================
    - name: Integrate Go 1.27 Toolchain (升级 golang 工具链)
      working-directory: /builder/openwrt
      run: |
        echo "=== 1. 克隆作者指定的 Go 1.27 快照 Commit ==="
        mkdir -p /tmp/golang-daed-src
        git clone -q https://github.com/immortalwrt/packages.git /tmp/golang-daed-src
        # 升级 golang 版本，打开 https://github.com/immortalwrt/packages.git（保持 master 默认主分支），复制最新的 commits 替换下方“25ad600a90980bed1ee76a212f9a5e42b499bb62”即可拉取 golang 最新版本
        # 升级 golang 版本，还必须更新下方代码中所有 golang1.27 版本号（最新版本号查看：打开 https://github.com/immortalwrt/packages.git，打开 lang/golang/golang1.27/Makefile 文件，找到：PKG_NAME:=golang1.27）
        git -C /tmp/golang-daed-src checkout 25ad600a90980bed1ee76a212f9a5e42b499bb62

        echo "=== 2. 隔离提取 lang/golang 到 package/golang-daed ==="
        rm -rf package/golang-daed
        mkdir -p package/golang-daed
        # 排除默认的 golang 目录，避免破坏上游系统的 golang 别名
        rsync -av --exclude='golang' /tmp/golang-daed-src/lang/golang/ package/golang-daed/
        rm -rf /tmp/golang-daed-src

        echo "=== 3. 强刷新并安装 golang1.27 工具包 ==="
        ./scripts/feeds install -p packages -f golang1.27

        echo "=== 4. 动态重定向代理组件的 Golang 编译依赖 (如 daed / passwall 等) ==="
        # 寻找包含 golang 编译依赖的所有 Makefile 并替换指向 golang-daed 和 golang1.27/host
        find package/ feeds/ -type f -name "Makefile" | while read -r mk; do
          if grep -q "golang/host" "$mk" || grep -q "golang-package.mk" "$mk"; then
            echo "Patching Golang dependency in: $mk"
            # 将 golang/host 替换为 golang1.27/host
            sed -i 's|golang/host|golang1.27/host|g' "$mk"
            # 无论上游是用什么绝对或相对路径引入 golang-package.mk，全部重定向到我们隔离的 package/golang-daed
            sed -i 's|.*golang-package\.mk|include $(TOPDIR)/package/golang-daed/golang-package.mk|g' "$mk"
          fi
        done

        # 删除临时目录
        rm -rf tmp
        
        # =====================================================================================
        # 🌟 2. 检查 Passwall 是否成功替换 golang1.27 版本（升级 golang 版本如果改变了路径，会报错）
        # =====================================================================================
        echo "=== 5. 检查是否成功挂载 golang-daed 工具链 ==="
        GOLANG_TARGET_FILE="package/golang-daed/golang1.27/Makefile"
        if [ -f "$GOLANG_TARGET_FILE" ] && grep -q "PKG_NAME:=golang1.27" "$GOLANG_TARGET_FILE"; then
          echo "SUCCESS: 验证通过，在 $GOLANG_TARGET_FILE 中包含 PKG_NAME:=golang1.27"
        else
          echo "ERROR: 验证失败！未在 package/golang-daed/golang1.27/Makefile 中找到对应配置。"
          exit 1
        fi

        echo "=== 6. 精准检查 package/passwall-packages 下的 Makefile 依赖 ==="
        # 寻找 package/passwall-packages 中任意一个包含 golang 依赖的 Makefile 进行精准断言
        PW_MK=$(find package/passwall-packages/ -type f -name "Makefile" -exec grep -l "golang1.27/host" {} + | head -n 1)
        if [ -n "$PW_MK" ]; then
          echo "SUCCESS: 验证通过！Passwall 目录下的组件已成功指向 golang1.27/host: $PW_MK"
        else
          echo "ERROR: 校验失败！未在 package/passwall-packages/ 中找到指向 golang1.27/host 的 Makefile，路径替换未生效！"
          exit 1
        fi
        
        echo "=== 7. 检查确保全局是否成功指向 golang-daed ==="
        CHECKED_MK=$(find package/ feeds/ -type f -name "Makefile" -exec grep -l "package/golang-daed/golang-package.mk" {} + | head -n 1)
        if [ -n "$CHECKED_MK" ]; then
          echo "SUCCESS: 全局 Makefile 引用抽查通过: $CHECKED_MK"
        else
          echo "ERROR: 校验失败！未找到对 package/golang-daed/golang-package.mk 的引用。"
          exit 1
        fi
        
        # 删除临时目录
        rm -rf tmp
                
    - name: Configuration Customization - Build_7DR7299_immortalwrt_237_golang 
      run: |
        # 在升级的分支，找到“Quickstart”下方：5. 看到 "# MT7986" 配置文件命令：cp -f defconfig/mt7988_mt7992.config .config 可确认该分支包含 TPLink-7DR7299 官方原厂闭源
        # 将配置文件从 defconfig 目录复制到根目录并重命名 .config，云编译的目录和官方目录不同，所以命令中必须修改路径
        cp -f /builder/openwrt/defconfig/mt7988_mt7992.config /builder/openwrt/.config
        
        # 追加你要的插件配置，打开 feeds.conf.default文件，再打开luci仓库，选择“openwrt-24.10”分支，找到“applications”查询插件
        cat >> /builder/openwrt/.config <<EOF
        CONFIG_PACKAGE_luci-app-autoreboot=y
        CONFIG_PACKAGE_luci-app-msd_lite=y
        CONFIG_PACKAGE_luci-app-openclash=y
        # ================= Passwall 主程序 =================
        CONFIG_PACKAGE_luci-app-passwall=y
        # 用于读取和解析大陆 IP/域名数据库（GeoIP / GeoSite）的轻量级工具
        CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Geoview=y

        # ================= 核心代理内核 (Sing-Box + Xray) =================
        CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=y
        CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y

        # ================= 显式关闭不必要的组件与插件 =================
        # 负载均衡
        # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Haproxy is not set
        # Shadowsocks 客户端
        # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client is not set
        # Shadowsocks 服务端
        # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Server is not set
        # ShadowsocksR 客户端
        # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Client is not set
        # ShadowsocksR 服务端
        # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Server is not set
        # Hysteria v1 独立客户端
        # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Hysteria is not set
        # NaiveProxy 独立客户端
        # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_NaiveProxy is not set
        # Shadow_TLS 独立客户端
        # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadow_TLS is not set
        # Simple_Obfs 老旧混淆插件 (Shadowsocks 混淆插件，给 SS 做混淆)
        # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Simple_Obfs is not set
        # V2ray 独立客户端
        # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Plugin is not set
        # Xray-Plugin 混淆插件 (Shadowsocks 混淆插件，给 SS 做混淆，非 Xray 核心)
        # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray_Plugin is not set
        # V2ray_Geodata 旧版数据包
        # CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Geodata is not set
        EOF
        
        # Modify default IP 将默认IP地址 192.168.6.1 修改为 192.168.2.1
        sed -i 's/192.168.6.1/192.168.2.1/g' /builder/openwrt/package/base-files/files/bin/config_generate
        # 更改主机名
        sed -i 's/ImmortalWrt/TL-7DR7299/g' /builder/openwrt/package/base-files/files/bin/config_generate
        cd /builder/openwrt && rm -rf tmp && make defconfig

    - name: Download package
      working-directory: /builder/openwrt
      run: |
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Build firmware
      working-directory: /builder/openwrt
      # 编译超过 5 小时，自动退出编译，防止后台静默卡死
      timeout-minutes: 300
      env:
        # 禁用 Git 终端交互提示，遇到需要输入密码或确认时，自动退出编译，防止后台静默卡死
        GIT_TERMINAL_PROMPT: 0
        # 禁用 Git 隐式文件锁，避免在多进程/并发 Git 操作时因锁争用导致的异常
        GIT_OPTIONAL_LOCKS: 0
      run: |
        echo -e "$(nproc) thread build."
        # 先尝试多线程全速编译，如果失败（返回非 0 状态码），则触发单线程编译，重新编译并输出详细日志
        make -j$(nproc) || make -j1 V=s

    - name: Check Space
      run: |
        df -h

    - name: Organize Files (整理固件与插件)
      id: organize
      working-directory: /builder/openwrt
      if: success() && !cancelled()
      run: |
        # 1. 创建专门存放固件的临时目录
        mkdir -p /tmp/firmware

        # 2. 定位 targets 编译产物目录（在绝对路径 /builder/openwrt/bin/targets/ 下寻找）
        TARGET_DIR=$(find /builder/openwrt/bin/targets/ -maxdepth 2 -mindepth 2 -type d | head -n 1)
        
        if [ -d "$TARGET_DIR" ]; then
          # 复制所有 targets 镜像、itb 文件、manifest、bl2.bin、sha256sums 等
          cp -r $TARGET_DIR/* /tmp/firmware/ 2>/dev/null || true
        fi

        # 3. 复制并重命名配置文件
        cp /builder/openwrt/.config /tmp/firmware/config.buildinfo 2>/dev/null || true
        cp /builder/openwrt/.config /tmp/firmware/build.config 2>/dev/null || true

        # 4. 打包所有编译生成的 ipk/apk 插件为 Packages.tar.gz
        if [ -d "/builder/openwrt/bin/packages" ]; then
            mkdir -p /tmp/pkg_temp
            # 同时兼容 ipk 和 apk 两种安装包格式
            find /builder/openwrt/bin/packages -type f \( -name "*.ipk" -o -name "*.apk" \) -exec cp -f {} /tmp/pkg_temp/ \;
            tar -zcf /tmp/firmware/Packages.tar.gz -C /tmp pkg_temp
            rm -rf /tmp/pkg_temp
        fi

        # 5. 精准清理不需要的临时 Packages 文件夹和多余的中间 buildinfo
        rm -rf /tmp/firmware/packages /tmp/firmware/feeds.buildinfo /tmp/firmware/version.buildinfo 2>/dev/null || true

        # ===============================================================
        # 👇【修改区】修改成脚本的名称
        FIRMWARE_TYPE="Build_7DR7299_immortalwrt_237_golang"
        # ===============================================================

        # 6. 将 FIRMWARE_TYPE 连同 TAG 和 NAME 一起写入 GITHUB_ENV 传递给后续步骤
        echo "FIRMWARE_TYPE=${FIRMWARE_TYPE}" >> $GITHUB_ENV
        echo "RELEASE_TAG=${FIRMWARE_TYPE}_$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV
        echo "RELEASE_NAME=${FIRMWARE_TYPE} [$(date +'%Y.%m.%d')]" >> $GITHUB_ENV

    - name: Upload firmware to Release (发布至 GitHub Release)
      uses: softprops/action-gh-release@v3
      if: success() && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: '${{ env.RELEASE_TAG }}'
        name: '${{ env.RELEASE_NAME }}'
        body: |
          ### 固件信息
          ${{ env.FIRMWARE_TYPE }}
        files: /tmp/firmware/*

